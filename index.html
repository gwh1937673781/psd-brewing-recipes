<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酿酒配方图谱 · Probably Stolen</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #3d3229;
      --muted: #7a6f64;
      --border: #e3ddd3;
      --fan: #d4a373;
      --yuan: #7fb3b3;
      --qing: #e08fa8;
      --yi: #9b8ec7;
      --fail: #8c8a86;
      --cross: #6ca3c4;
      --shadow: 0 4px 14px rgba(61, 50, 41, .08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(247, 245, 240, .92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 14px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.65rem;
      letter-spacing: -.5px;
    }

    .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 14px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }

    button, input {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      background: var(--card);
      color: var(--text);
      font-size: .88rem;
      cursor: pointer;
      transition: .15s;
    }

    button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    button.active { color: #fff; border-color: transparent; }

    .btn-all.active { background: #5a6e7c; }
    .btn-fan.active { background: var(--fan); }
    .btn-yuan.active { background: var(--yuan); }
    .btn-qing.active { background: var(--qing); }
    .btn-yi.active { background: var(--yi); }
    .btn-cross.active { background: var(--cross); }
    .btn-fail.active { background: var(--fail); }

    input[type="search"] {
      flex: 1 1 220px;
      max-width: 320px;
      border-radius: 999px;
      padding-left: 18px;
      outline: none;
    }

    input[type="search"]:focus { border-color: var(--fan); box-shadow: 0 0 0 3px rgba(212, 163, 115, .18); }

    main { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }

    .section-title {
      font-size: 1.15rem;
      margin: 28px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .recipe-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: .15s;
      border: 1px solid transparent;
    }

    .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(61, 50, 41, .12); }
    .recipe-card.dim { opacity: .35; }

    .card-band {
      height: 6px;
      background: var(--muted);
    }

    .card-body {
      padding: 14px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-category {
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: .5px;
    }

    .ingredients {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 12px;
      transition: .15s;
    }

    .item:hover { background: rgba(0, 0, 0, .04); }

    .item-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      background: #f0ece3;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
      overflow: hidden;
    }

    .item-img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      display: block;
    }

    .product .item-icon { width: 56px; height: 56px; }

    .item-name {
      font-size: .82rem;
      text-align: center;
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plus {
      font-size: 1.2rem;
      color: var(--muted);
      font-weight: 700;
      margin: 0 2px;
    }

    .arrow-down {
      text-align: center;
      color: var(--muted);
      font-size: 1.3rem;
      margin: -2px 0 8px;
    }

    .product {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, .03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-top: auto;
      min-height: 64px;
    }

    .product .item { flex-direction: row-reverse; align-items: center; gap: 10px; }
    .product .item-icon { width: 40px; height: 40px; }
    .product .item-name { max-width: 140px; font-weight: 700; white-space: normal; line-height: 1.25; text-align: left; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: .72rem;
      color: #fff;
      margin-left: 6px;
    }

    .simulator {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .sim-title { font-weight: 700; margin-bottom: 12px; font-size: 1.05rem; }

    .sim-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    select { display: none; }

    .custom-select { position: relative; display: inline-block; }

    .select-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 120px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: .9rem;
      cursor: pointer;
      font-family: inherit;
    }

    .select-trigger img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }

    .select-trigger span:last-child { margin-left: auto; color: var(--muted); }

    .select-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 50;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .12);
      max-height: 320px;
      overflow-y: auto;
      min-width: 220px;
    }

    .select-panel.open { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .select-panel .opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #f9f8f5;
      font-size: .74rem;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
    }

    .select-panel .opt:hover { background: #f0ece3; border-color: var(--border); }

    .select-panel .opt img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .sim-result {
      min-height: 60px;
      border-radius: 14px;
      background: #f9f8f5;
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      flex-wrap: wrap;
    }

    .empty { color: var(--muted); font-size: .9rem; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 8px 0 18px;
      font-size: .82rem;
      color: var(--muted);
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      padding: 20px;
    }

    @media (max-width: 640px) {
      .recipe-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>

      <input type="search" id="search" placeholder="搜索材料或酒名…" />

    <div class="legend">

          <div class="select-panel" id="panelB"></div>

        <button id="simBtn">酿一下</button>
      </div>
      <div class="sim-result" id="simResult">
        <span class="empty">选择两种材料后点击“酿一下”</span>
      </div>
    </section>

    <div id="activeIngredient" style="display:none; margin-bottom:12px; color:var(--muted); font-size:.9rem;"></div>
    <div id="content"></div>
  </main>

    const FAIL_MAP = {
      fan: '杂酿',
      yuan: '异调',
      qing: '错付',
      yi: '余烬'
    };

    const FAIL_EMOJI = { fan: '🍺', yuan: '🍸', qing: '🍷', yi: '🥃' };

    function materialItem(name, big = false) {
      if (name.endsWith('材料')) {
        const cat = name.replace('材料', '');
        const c = CATS[cat] || CATS.fail;
        return `<div class="item">
          <div class="item-icon" style="background:${c.color}22">${c.emoji}</div>
          <div class="item-name">${name}</div>
        </div>`;
      }
      const info = INGREDIENTS[name] || { cat: 'fail', emoji: '❓' };
      const c = CATS[info.cat] || CATS.fail;
      const img = ICON[name];
      const inner = img
        ? `<img class="item-img" src="${img}" alt="${name}">`
        : `<span style="font-size:${big ? '2rem' : '1.7rem'}">${info.emoji}</span>`;
      return `<div class="item" data-name="${name}">
        <div class="item-icon" style="background:${img ? '#fff' : c.color + '22'}">${inner}</div>
        <div class="item-name">${name}</div>
      </div>`;
    }

    function productItem(name, cat) {
      const c = CATS[cat] || CATS.fail;
      const img = ICON[name];
      const inner = img
        ? `<img class="item-img" src="${img}" alt="${name}">`
        : `<span style="font-size:2rem">🍶</span>`;
      return `<div class="item">
        <div class="item-icon" style="background:${img ? '#fff' : c.color + '22'}">${inner}</div>
        <div class="item-name">${name}</div>
      </div>`;
    }

    function renderCard(r) {
      return `
        <div class="recipe-card" data-cat="${r.cat}" data-ingredients="${r.a},${r.b}" data-search="${r.a} ${r.b} ${r.out} ${r.src}">
          <div class="card-band" style="background:${CATS[r.cat].color}"></div>
          <div class="card-body">
            <div class="card-category">${r.src} <span class="tag" style="background:${CATS[r.cat].color}">${CATS[r.cat].name}</span></div>
            <div class="ingredients">
              ${materialItem(r.a)} <span class="plus">+</span> ${materialItem(r.b)}
            </div>
            <div class="arrow-down">▼</div>
            <div class="product">
              ${productItem(r.out, r.cat)}
            </div>
          </div>
        </div>
      `;
    }

    function groupRecipes(list) {
      const groups = {};
      for (const r of list) {
        if (!groups[r.cat]) groups[r.cat] = [];
        groups[r.cat].push(r);
      }
      return groups;
    }

    function renderAll() {
      const active = document.querySelector('.filters button.active').dataset.filter;
      const q = document.getElementById('search').value.trim().toLowerCase();
      const highlight = document.getElementById('activeIngredient').dataset.name || '';

      let list = RECIPES;
      if (active !== 'all') list = list.filter(r => r.cat === active);
      if (q) list = list.filter(r => (r.a + ' ' + r.b + ' ' + r.out + ' ' + r.src).toLowerCase().includes(q));
      if (highlight) list = list.filter(r => r.a === highlight || r.b === highlight);

      const groups = groupRecipes(list);
      const order = ['fan', 'yuan', 'cross', 'qing', 'yi', 'fail'];
      let html = '';
      for (const cat of order) {
        if (!groups[cat]) continue;
        html += `
          <div class="section-title">
            <span class="dot" style="background:${CATS[cat].color}"></span>
            ${CATS[cat].emoji} ${CATS[cat].name}配方 (${groups[cat].length})
          </div>
          <div class="recipe-grid">${groups[cat].map(renderCard).join('')}</div>
        `;
      }
      if (!html) html = '<div style="text-align:center;color:var(--muted);padding:40px 0">没有找到匹配的配方</div>';
      document.getElementById('content').innerHTML = html;
    }

    function buildSimulator() {
      const names = Object.keys(INGREDIENTS);
      const opts = names.map(n => `<option value="${n}">${n}</option>`).join('');
      const selA = document.getElementById('matA');
      const selB = document.getElementById('matB');
      selA.innerHTML = opts;
      selB.innerHTML = opts;
      selB.selectedIndex = 1;

      function setup(sel, trigger, panel, initialIdx) {
        sel.selectedIndex = initialIdx;

        function renderTrigger() {
          const name = sel.value;
          const uri = ICON[name] || '';
          trigger.innerHTML = uri
            ? `<img src="${uri}" alt=""><span>${name}</span><span>▾</span>`
            : `<span>${name}</span><span>▾</span>`;
        }

        panel.innerHTML = names.map(n => {
          const uri = ICON[n] || '';
          return `<button type="button" class="opt" data-val="${n}">
            ${uri ? `<img src="${uri}" alt="">` : `<span>${INGREDIENTS[n].emoji}</span>`}
            ${n}
          </button>`;
        }).join('');

        panel.querySelectorAll('.opt').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            sel.value = btn.dataset.val;
            renderTrigger();
            panel.classList.remove('open');
          });
        });

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const willOpen = !panel.classList.contains('open');
          document.querySelectorAll('.select-panel').forEach(p => p.classList.remove('open'));
          if (willOpen) panel.classList.add('open');
        });

        renderTrigger();
      }

      setup(selA, document.getElementById('triggerA'), document.getElementById('panelA'), 0);
      setup(selB, document.getElementById('triggerB'), document.getElementById('panelB'), 1);

      document.addEventListener('click', () => {
        document.querySelectorAll('.select-panel').forEach(p => p.classList.remove('open'));
      });
    }

    function simulate() {
      const a = document.getElementById('matA').value;
      const b = document.getElementById('matB').value;
      const res = document.getElementById('simResult');

      // 查找正常配方（顺序无关）
      const found = RECIPES.find(r => !r.cross && ((r.a === a && r.b === b) || (r.a === b && r.b === a)));
      if (found) {
        const c = CATS[found.cat];
        res.innerHTML = `
          ${materialItem(a)} <span class="plus">+</span> ${materialItem(b)}
          <span style="font-size:1.3rem">➜</span>
          ${productItem(found.out, found.cat)}
          <span class="tag" style="background:${c.color}">${found.src}</span>
        `;
        return;
      }

      // 失败规则：同分类任意错配
      const ca = INGREDIENTS[a].cat;
      const cb = INGREDIENTS[b].cat;
      if (ca === cb) {
        const failName = FAIL_MAP[ca];
        const c = CATS[ca];
        res.innerHTML = `
          ${materialItem(a)} <span class="plus">+</span> ${materialItem(b)}
          <span style="font-size:1.3rem">➜</span>
          ${productItem(failName, 'fail')}
          <span class="tag" style="background:var(--fail)">失败手札 · 同产地错配</span>
        `;
        return;
      }

      res.innerHTML = `
        ${materialItem(a)} <span class="plus">+</span> ${materialItem(b)}
        <span style="font-size:1.3rem">➜</span>
        ${productItem('未知产物', 'fail')}
        <span class="tag" style="background:var(--fail)">跨产地错配 · 未收录</span>
      `;
    }

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderAll();
      });
    });

    document.getElementById('search').addEventListener('input', renderAll);

    document.getElementById('content').addEventListener('click', e => {
      const item = e.target.closest('.item[data-name]');
      if (!item) return;
      const name = item.dataset.name;
      document.getElementById('activeIngredient').style.display = 'block';
      document.getElementById('activeIngredient').dataset.name = name;
      document.getElementById('activeIngredient').innerHTML = `🔍 只显示含「<b>${name}</b>」的配方 · <a href="#" id="clearFilter" style="color:var(--fan)">清除过滤</a>`;
      renderAll();
    });

    document.getElementById('activeIngredient').addEventListener('click', e => {
      if (e.target.id === 'clearFilter') {
        e.preventDefault();
        document.getElementById('activeIngredient').style.display = 'none';
        document.getElementById('activeIngredient').dataset.name = '';
        renderAll();
      }
    });

    document.getElementById('simBtn').addEventListener('click', simulate);

    buildSimulator();
    renderAll();
  </script>
</body>
</html>
